# 设备与采集配置（可按本机环境修改）
# 修改后无需改代码；CLI 默认读取本文件。

adb:
  # 无线调试地址。可写 "IP" 或 "IP:端口"；省略端口时用 port。
  host: "192.168.43.244"
  port: 5555
  # 若填写 serial，则优先使用（可含端口），忽略上面的 host/port 拼接结果。
  # serial: "192.168.43.244:5555"
  # 本机 adb 可执行文件；留空则从 PATH 查找。
  adb_path: ""
  connect_timeout_sec: 15

capture:
  # 录制时长（秒）。部分设备 screenrecord 最长约 180 秒。
  duration_sec: 15
  # 设备端输出路径（POSIX）。代码会处理 Git Bash/MSYS 路径误转换。
  remote_dir: "/sdcard/echo_eval"
  remote_filename: "capture.mp4"
  # 本机产物根目录（相对仓库根或绝对路径）
  local_dir: "artifacts"
  # 抽帧：每秒帧数；0 表示不抽帧
  fps: 1
  # 本机 ffmpeg；留空则从 PATH 查找
  ffmpeg_path: ""

stimulus:
  # true 时，record/spike 会在录屏开始后播放本机音频（设备麦克拾音）
  enabled: false
  type: audio_file
  # 相对仓库根或绝对路径；可换成你的唤醒词 wav
  path: assets/audio/beep_1s.wav
  # 目前仅支持 host（电脑外放）
  play_device: host
  # 开录后再延迟播放，给 screenrecord 启动留时间
  start_delay_sec: 1.0

tts:
  # sapi | edge | file（edge 需出网；http 预留）
  backend: edge
  voice: zh-CN-XiaoxiaoNeural
  rate: 0
  lookup_dir: ""
  # edge 连不上时回退本机 SAPI（仅 Windows）
  fallback_sapi: true

run:
  # Excel 步骤默认等待（表内「等待时间」列可覆盖）
  step_wait_sec: 3
  # 开录后稍等再播第一句
  head_delay_sec: 1
  # 说完后再多录几秒，便于界面出结果
  tail_sec: 5
  # 每条用例结束后按一次系统 Home，再等一会再开下一条
  return_home_after_case: true
  return_home_wait_sec: 2
  # 设备串行执行；抽帧+VL 后台并行（不挡下一条）
  judge_async: true
  judge_parallel: 3
  # 每条用例正式步骤前播唤醒词（不参与任何评判）
  wake_enabled: true
  wake_text: "小翼管家"
  wake_wait_sec: 3.0

# ASR 准确率（P1）：句后截屏 + VL；与 GUI 成功率互不影响
asr:
  enabled: true
  interval_sec: 0.5
  window_sec: 4.0
  early_stop: true
  early_stop_stable_frames: 2
  bottom_band_ratio: 0.22
  # 多条用 | 分隔（简易 YAML 解析器不支持列表）
  ignore_texts: "我还在听，说再见退出"

# 端到端时延（P2）：说完→画面首变；忽略底部识别条文案变化；超时=无操控
# 相对「播报前」上半屏基线比较；慢截屏时用下发时刻而非文件落盘时刻
latency:
  enabled: true
  fps: 10
  window_sec: 8.0
  bottom_band_ratio: 0.22
  change_threshold: 6.0

# TTS MOS（P3）：主机麦录设备外放（screenrecord 无音频）。Windows 请填写 dshow 设备名
# input_device 可写「audio=名称」或纯名称（代码会自动补 audio=）
mos:
  enabled: true
  window_sec: 5.0
  sample_rate: 16000
  min_speech_sec: 0.3
  input_format: "dshow"
  input_device: ""

# 预置条件：开跑前覆盖检查；每条正式测前 force-stop→Home→回放 ADB
precondition:
  enabled: true
  coverage_check: true
  # 回放后再 VL 验一次；false=已通过不用重新测试
  # 已 pass 一律回放 ADB；校准默认只跑未全部 pass 的用例（--force 重训已 pass）
  verify_after_replay: false
  max_retries: 3
  # 每步默认等待；打开 App 等广告可用 overrides 拉长
  step_settle_sec: 1.0
  step_settle_overrides:
    打开爱奇艺: 8
    打开设置: 2
  cache_dir: artifacts/precondition_cache
  packages_path: configs/packages.yaml
