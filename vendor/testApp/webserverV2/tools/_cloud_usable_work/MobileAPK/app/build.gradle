plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.devicesdkdemo'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    defaultConfig {
        applicationId "com.example.devicesdkdemo"
        minSdk 28
        targetSdk 34
        versionCode 36
        versionName "1.0-v25cloud-no-media"
        buildConfigField "String", "BUILD_TIME", "\"" + new Date().format("yyyy-MM-dd HH:mm:ss") + "\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    packagingOptions {
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(':testreply-sdk')
    implementation(project(':aisfsdk')) {
        exclude group: 'org.bouncycastle', module: 'bcutil-jdk15to18'
    }
}
