{% extends "base.html" %}
{% block title %}网盘搜索 - TestApp{% endblock %}
{% block extra_css %}
<style>
  .page-content.pan-search-wrap {
    padding: 0 !important;
    height: calc(100vh - 52px);
    overflow: hidden;
  }
  .pan-search-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #f3efe6;
  }
</style>
{% endblock %}
{% block content %}
<iframe
  class="pan-search-frame"
  title="网盘搜索"
  src="{{ gui_base_path }}/pan-search/app?v=26"
></iframe>
{% endblock %}
{% block extra_js %}
<script>
  (function () {
    var pc = document.querySelector(".page-content");
    if (pc) pc.classList.add("pan-search-wrap");
  })();
</script>
{% endblock %}
