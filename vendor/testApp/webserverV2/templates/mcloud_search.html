{% extends "base.html" %}
{% block title %}移动网盘搜索 - TestApp{% endblock %}
{% block extra_css %}
<style>
  .page-content.mcloud-search-wrap {
    padding: 0 !important;
    height: calc(100vh - 52px);
    overflow: hidden;
  }
  .mcloud-search-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #f3efe6;
  }
</style>
{% endblock %}
{% block content %}
<iframe
  class="mcloud-search-frame"
  title="移动网盘搜索"
  src="{{ gui_base_path }}/mcloud-search/app?v=1"
></iframe>
{% endblock %}
{% block extra_js %}
<script>
  (function () {
    var pc = document.querySelector(".page-content");
    if (pc) pc.classList.add("mcloud-search-wrap");
  })();
</script>
{% endblock %}
