plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.devicesdkdemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.devicesdkdemo"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "1.0.1-focus-default"

        // 添加编译时间戳到 BuildConfig
        buildConfigField "String", "BUILD_TIME", "\"" + new Date().format("yyyy-MM-dd HH:mm:ss") + "\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        // Netty依赖冲突：netty-all与单独模块的META-INF文件重复
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(':testreply-sdk')

    // aisfsdk：优先本地 Maven（vendor/DeviceSDK/maven），见 settings.gradle
    implementation 'com.huawei.aisfsdk:aisfsdk:2.0.0'
}
