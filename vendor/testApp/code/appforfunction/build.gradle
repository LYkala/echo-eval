plugins {
    id 'com.android.application'
}

def appVersionCode = 1
def appVersionName = "1.0.0"

android {
    namespace 'com.example.appforfunction'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.appforfunction"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 自定义APK输出文件名
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "appforfunction"
            def buildType = variant.buildType.name
            def version = appVersionName
            def date = new Date().format("yyyyMMdd")
            outputFileName = "${appName}-v${version}-${buildType}-${date}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}